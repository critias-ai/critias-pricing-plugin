name: Feature request
description: Suggest a new analysis, method or business type.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The pricing question you want answered
      description: Describe the decision or analysis, and who it is for.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today
      description: The method, spreadsheet or tool you use now.
  - type: textarea
    id: data
    attributes:
      label: Data you would provide
      description: Column names and grain (e.g. one row per invoice line). No real figures.
